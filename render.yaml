services:
  - type: web
    name: la-condesa-clothing-shop
    runtime: python
    plan: free
    region: oregon
    branch: master
    rootDir: La-Condesa-Clothing-Shop
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
