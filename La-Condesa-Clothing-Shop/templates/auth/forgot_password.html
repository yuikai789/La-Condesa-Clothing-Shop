{% extends "base.html" %}

{% block title %}La Condesa - Recuperar Contraseña{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-9">
            <div class="card border-black shadow-lg">
                <div class="card-header bg-black text-white text-center py-3">
                    <h2 class="mb-0"><i class="bi bi-key me-2"></i>Recuperar Contraseña</h2>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-4">
                        Ingresa tu correo registrado y te enviaremos un enlace para restablecer tu contraseña.
                    </p>
                    <form method="POST" action="{{ url_for('auth.forgot_password') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-4">
                            <label for="email" class="form-label fw-bold">
                                <i class="bi bi-envelope me-1"></i>Correo Electrónico
                            </label>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-black btn-lg py-2 fw-bold">
                                <i class="bi bi-send me-2"></i>Enviar enlace
                            </button>
                        </div>
                    </form>
                    <hr class="my-4">
                    <div class="text-center">
                        <a href="{{ url_for('auth.login') }}" class="text-decoration-none fw-bold" style="color: var(--primary-gold);">
                            Volver a iniciar sesión
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
