{% extends "base.html" %}

{% block title %}La Condesa - Nueva Contraseña{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7 col-sm-9">
            <div class="card border-black shadow-lg">
                <div class="card-header bg-black text-white text-center py-3">
                    <h2 class="mb-0"><i class="bi bi-shield-lock me-2"></i>Nueva Contraseña</h2>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold">
                                <i class="bi bi-lock me-1"></i>Contraseña
                            </label>
                            <input type="password" class="form-control" id="password" name="password"
                                   placeholder="••••••••" required minlength="8">
                            <div class="form-text">
                                Mínimo 8 caracteres, incluir mayúsculas, minúsculas y números
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-bold">
                                <i class="bi bi-lock-fill me-1"></i>Confirmar Contraseña
                            </label>
                            <input type="password" class="form-control" id="confirm_password"
                                   name="confirm_password" placeholder="••••••••" required minlength="8">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-black btn-lg py-2 fw-bold">
                                <i class="bi bi-check2-circle me-2"></i>Actualizar contraseña
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
